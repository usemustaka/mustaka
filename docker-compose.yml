services:
  postgres:
    image: postgres:18.4-alpine3.24
    container_name: mustaka-postgres
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/18/docker

  redis:
    image: redis:7-alpine
    container_name: mustaka-redis
    restart: always
    ports:
      - "6379:6379"

  nats:
    image: nats:alpine
    container_name: mustaka-nats
    restart: always
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio
    container_name: mustaka-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ./.minio:/data

  adminer:
    image: adminer
    container_name: mustaka-adminer
    restart: always
    ports:
      - "8080:8080"
